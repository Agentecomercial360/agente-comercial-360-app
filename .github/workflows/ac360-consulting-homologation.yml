name: AC360 Consulting Supabase Homologation

# Manual only. Do not run on production or with customer data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consulting-supabase-smoke:
    name: Supabase Auth and Data API smoke (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AC360_RLS_TEST_URL: ${{ secrets.AC360_RLS_TEST_URL }}
      AC360_RLS_TEST_ANON_KEY: ${{ secrets.AC360_RLS_TEST_ANON_KEY }}
      AC360_RLS_TEST_PROJECT_REF: ${{ secrets.AC360_RLS_TEST_PROJECT_REF }}
      AC360_RLS_TEST_ADMIN_EMAIL: ${{ secrets.AC360_RLS_TEST_ADMIN_EMAIL }}
      AC360_RLS_TEST_ADMIN_PASSWORD: ${{ secrets.AC360_RLS_TEST_ADMIN_PASSWORD }}
      AC360_RLS_TEST_A_EMAIL: ${{ secrets.AC360_RLS_TEST_A_EMAIL }}
      AC360_RLS_TEST_A_PASSWORD: ${{ secrets.AC360_RLS_TEST_A_PASSWORD }}
      AC360_RLS_TEST_B_EMAIL: ${{ secrets.AC360_RLS_TEST_B_EMAIL }}
      AC360_RLS_TEST_B_PASSWORD: ${{ secrets.AC360_RLS_TEST_B_PASSWORD }}
      AC360_RLS_TEST_A_ASSIGNMENT_ID: ${{ secrets.AC360_RLS_TEST_A_ASSIGNMENT_ID }}
      AC360_RLS_TEST_B_ASSIGNMENT_ID: ${{ secrets.AC360_RLS_TEST_B_ASSIGNMENT_ID }}
      AC360_RLS_TEST_ISOLATED: ${{ secrets.AC360_RLS_TEST_ISOLATED }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Reject missing or production configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${AC360_RLS_TEST_ISOLATED:-}" != "YES" ]]; then
            echo "::error::Isolated synthetic test acknowledgement is required"
            exit 1
          fi
          if [[ -z "${AC360_RLS_TEST_PROJECT_REF:-}" || "${AC360_RLS_TEST_PROJECT_REF}" == "dmwcbecihuxqzzjouevk" ]]; then
            echo "::error::A non-production Supabase project is required"
            exit 1
          fi
          if [[ "${AC360_RLS_TEST_URL:-}" != "https://${AC360_RLS_TEST_PROJECT_REF}.supabase.co" ]]; then
            echo "::error::Test URL must match the isolated project reference"
            exit 1
          fi
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify real Supabase authentication and row isolation
        run: node tests/consulting/rlsIsolationSmoke.mjs
